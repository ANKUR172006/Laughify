<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Geist+Pixel&display=swap');


* {
  box-sizing: border-box;
}

body {
  min-height: 100vh;
  
  color: #222;
  background-color: #ececec;
  
  font-size: clamp(1rem, 2vw + 0.5rem, 2rem);
  font-family: "Geist Pixel", sans-serif;
  font-smoothing: antialiased;
  
  display: flex;
  justify-content: center;
  align-items: center;
}

svg {
  width: 0;
  height: 0;
}

button {
  appearance: none;
  padding: 6px 18px;
  color: inherit;
  
  border: 3px solid;
  border-radius: 24px;
  background-color: #8cec84;
  
  font-family: inherit;
  font-weight: bold;
  font-size: 48px;
  
  animation: squiggly 0.35s linear infinite;
  transition: scale 0.2s;
  cursor: pointer;
  
  &:active {
    scale: 0.98;
  }
}

@keyframes squiggly {
  0% {
    filter: url('#squiggly-0');
  }
  25% {
    filter: url('#squiggly-1');
  }
  50% {
    filter: url('#squiggly-2');
  }
  75% {
    filter: url('#squiggly-3');
  }
  100% {
    filter: url('#squiggly-4');
  }
}
    </style>
</head>
<body>
    <svg>
  <filter id="squiggly-0">
      <feTurbulence id="turbulence" baseFrequency="0.01" numOctaves="3" result="noise" seed="0"/>
      <feDisplacementMap id="displacement" in="SourceGraphic" in2="noise" scale="2" />
    </filter>
    <filter id="squiggly-1">
      <feTurbulence id="turbulence" baseFrequency="0.02" numOctaves="3" result="noise" seed="1"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="2" />
    </filter>

    <filter id="squiggly-2">
      <feTurbulence id="turbulence" baseFrequency="0.01" numOctaves="3" result="noise" seed="2"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="2" />
    </filter>
    <filter id="squiggly-3">
      <feTurbulence id="turbulence" baseFrequency="0.02" numOctaves="3" result="noise" seed="3"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="2" />
    </filter>

    <filter id="squiggly-4">
      <feTurbulence id="turbulence" baseFrequency="0.01" numOctaves="3" result="noise" seed="4"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="2" />
    </filter>
</svg>

<button>▶︎ Start</button>
</body>
</html>
