<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 240" role="img" aria-label="Laughify logo">
  <defs>
    <linearGradient id="badgeFill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e0f2fe"/>
      <stop offset="0.45" stop-color="#93c5fd"/>
      <stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="wordFill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fb923c"/>
      <stop offset="0.22" stop-color="#ec4899"/>
      <stop offset="0.48" stop-color="#8b5cf6"/>
      <stop offset="0.7" stop-color="#38bdf8"/>
      <stop offset="0.88" stop-color="#10b981"/>
      <stop offset="1" stop-color="#fbbf24"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feOffset dx="10" dy="12" in="SourceAlpha" result="off"/>
      <feGaussianBlur stdDeviation="0.6" in="off" result="blur"/>
      <feColorMatrix
        in="blur"
        type="matrix"
        values="0 0 0 0 0.058823529  0 0 0 0 0.090196078  0 0 0 0 0.164705882  0 0 0 0.35 0"
        result="shadow"
      />
      <feMerge>
        <feMergeNode in="shadow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <g filter="url(#softShadow)">
    <rect x="20" y="20" width="200" height="200" rx="48" fill="url(#badgeFill)" stroke="#0f172a" stroke-width="12"/>
    <path d="M76 54c26-18 62-26 98-18" fill="none" stroke="#ffffff" stroke-width="10" stroke-linecap="round" opacity="0.7"/>
    <circle cx="86" cy="110" r="16" fill="#0f172a"/>
    <circle cx="154" cy="110" r="16" fill="#0f172a"/>
    <circle cx="80" cy="152" r="14" fill="#fb7185" opacity="0.55"/>
    <circle cx="160" cy="152" r="14" fill="#fb7185" opacity="0.55"/>
    <path d="M78 146c18 28 70 28 88 0" fill="none" stroke="#0f172a" stroke-width="12" stroke-linecap="round"/>
    <path d="M90 158c12 10 52 10 64 0" fill="none" stroke="#ffffff" stroke-width="8" stroke-linecap="round" opacity="0.85"/>
    <path d="M178 66l10 18 20 4-14 14 3 20-19-10-18 10 4-20-14-14 20-4z" fill="#fbbf24" stroke="#0f172a" stroke-width="8" stroke-linejoin="round"/>
  </g>

  <g filter="url(#softShadow)">
    <text
      x="260"
      y="158"
      font-family="'Geist Pixel','Fredoka','Arial Black',sans-serif"
      font-size="118"
      font-weight="900"
      letter-spacing="-5"
      fill="url(#wordFill)"
      stroke="#0f172a"
      stroke-width="14"
      paint-order="stroke fill"
    >LAUGHIFY</text>
  </g>
</svg>
